<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akashvani & All India Radio </title>
   
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --border: #334155;
            --accent: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            padding: 1.2rem 1rem;
            background-color: #090d16;
            border-bottom: 1px solid var(--border);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.3rem;
            color: #f3f4f6;
        }

        .controls-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            max-width: 500px;
            margin: 0 auto;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: #1e293b;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .channel-count {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .container {
            padding: 20px;
            margin-bottom: 110px;
            flex-grow: 1;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .channel-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .channel-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .channel-card.active {
            border: 2px solid var(--accent);
            background-color: #334155;
        }

        .channel-card img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: #0f172a;
        }

        .channel-card h3 {
            margin: 0;
            font-size: 0.85rem;
            line-height: 1.25;
            color: var(--text-main);
        }

        /* Fixed Bottom Audio Player */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #090d16;
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 35%;
        }

        .player-info img {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            background-color: #1e293b;
        }

        .player-details h4 {
            margin: 0;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-details p {
            margin: 3px 0 0 0;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-play {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background-color: var(--accent);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        .volume-container {
            width: 25%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        input[type=range] { accent-color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <h1>📻 Akashvani & All India Radio </h1>
        <div class="controls-top">
            <input type="text" id="searchBar" placeholder="Search station or language..." onkeyup="filterChannels()">
            <div class="channel-count" id="channelCount">Loading...</div>
        </div>
    </header>

    <div class="container">
        <div class="channel-grid" id="channelGrid"></div>
    </div>

    <div class="player-bar">
        <div class="player-info">

            <div class="player-details">

                <p id="currentStatus">Idle</p>
            </div>
        </div>

        <div class="controls">
            <button class="btn-play" id="playBtn" onclick="togglePlay()">▶</button>
        </div>

        <div class="volume-container">
            <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="1" onchange="setVolume(this.value)">
        </div>
    </div>

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        let currentKey = null;
        let hls = null;

        function renderChannels(channelData) {
            const grid = document.getElementById('channelGrid');
            grid.innerHTML = '';

            const keys = Object.keys(channelData);
            document.getElementById('channelCount').innerText = `Showing ${keys.length} Live Channels`;

            keys.forEach(key => {
                const item = channelData[key];
                const card = document.createElement('div');
                card.className = `channel-card ${currentKey === key ? 'active' : ''}`;
                card.onclick = () => loadChannel(key);

                card.innerHTML = `
                    <img src="${item.image}" alt="${item.name}" onerror="this.src='${defaultImg}'">
                    <h3>${item.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        function loadChannel(key) {
            currentKey = key;
            const channel = channels[key];

            document.getElementById('currentTitle').innerText = channel.name;
            document.getElementById('currentImg').src = channel.image || defaultImg;
            document.getElementById('currentStatus').innerText = 'Connecting...';

            if (Hls.isSupported()) {
                if (hls) { hls.destroy(); }
                hls = new Hls();
                hls.loadSource(channel.live_url);
                hls.attachMedia(audio);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    audio.play();
                });
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                audio.src = channel.live_url;
                audio.play();
            }

            renderChannels(channels);
        }

        function togglePlay() {
            if (!audio.src && !hls) return;
            if (audio.paused) { audio.play(); } else { audio.pause(); }
        }

        audio.onplay = () => {
            playBtn.innerText = '⏸';
            document.getElementById('currentStatus').innerText = 'Playing Live';
        };

        audio.onpause = () => {
            playBtn.innerText = '▶';
            document.getElementById('currentStatus').innerText = 'Paused';
        };

        function setVolume(val) { audio.volume = val; }

        function filterChannels() {
            const term = document.getElementById('searchBar').value.toLowerCase();
            const filtered = {};

            Object.keys(channels).forEach(key => {
                if (channels[key].name.toLowerCase().includes(term)) {
                    filtered[key] = channels[key];
                }
            });

            renderChannels(filtered);
        }

        // Initial load
        renderChannels(channels);
